<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>cordlumen</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <h1>cordlumen</h1>
        <a class="help-btn" href="./about.html" aria-label="測り方と撮り方">?</a>
      </header>
      <p class="lead">ネット全体（両ポストの根元まで）が写った写真を選ぶと、中央の高さを判定します。</p>
      <p class="lead">※ 判定は写真から推定した目安です。正確な高さはメジャーで確かめてください。</p>
      <div class="actions">
        <label class="pick">
          写真を選ぶ
          <input id="file" type="file" accept="image/*" />
        </label>
        <button id="live" class="pick live" type="button">カメラで測る</button>
      </div>
      <video id="cam" playsinline muted hidden></video>
      <p id="liveHint" class="live-hint" hidden>横向きに構えて、両方のポストを上の端から根元まで入れてください。</p>
      <p id="status" class="status"></p>
      <div id="verdict" class="verdict" hidden></div>
      <canvas id="view"></canvas>
      <table id="timings" class="timings" hidden>
        <tbody></tbody>
      </table>
    </main>
    <footer id="build" class="build"></footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
