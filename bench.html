<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>cordlumen bench</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <h1>cordlumen bench</h1>
      <p class="lead">学習していない小さなモデル（4点の位置を出す形）を動かし、メモリと時間を確かめるページです。結果の位置に意味はありません。</p>
      <label class="pick">
        写真を選ぶ
        <input id="file" type="file" accept="image/*" />
      </label>
      <p id="status" class="status"></p>
      <table id="timings" class="timings" hidden>
        <tbody></tbody>
      </table>
    </main>
    <footer id="build" class="build"></footer>
    <script type="module" src="./src/bench.ts"></script>
  </body>
</html>
